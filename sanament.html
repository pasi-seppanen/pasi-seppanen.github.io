<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sanament">
<meta name="theme-color" content="#0E2233">
<title>Sanament – suomalainen sanapeli</title>
<style>
:root{
  --jarvi:#16324A; --syva:#0E2233; --koivu:#F5EDDC; --koivu2:#EAD9B8;
  --lakka:#F08C2E; --lakka2:#FFB45E; --sammal:#7FB069; --teksti:#EAF2F8;
  --himmea:#8FA8BC; --vaara:#E0604F;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
body{
  font-family:ui-rounded,-apple-system,'SF Pro Rounded','Nunito',sans-serif;
  background:linear-gradient(175deg,var(--jarvi) 0%,var(--syva) 70%);
  color:var(--teksti);
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
.screen{flex:1; display:none; flex-direction:column; align-items:center; padding:16px; overflow-y:auto;}
.screen.active{display:flex;}

/* ---------- Aloitusnäkymä ---------- */
#startScreen{justify-content:center; gap:14px; text-align:center;}
.logo{font-size:44px; font-weight:800; letter-spacing:-1px;}
.logo .a{color:var(--lakka);}
.tagline{color:var(--himmea); font-size:15px; margin-top:-8px;}
.levelCard{
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  border-radius:20px; padding:18px 28px; min-width:240px;
}
.levelNum{font-size:38px; font-weight:800; color:var(--lakka2);}
.titleName{font-size:18px; font-weight:700; margin-top:2px;}
.titleHint{font-size:12px; color:var(--himmea); margin-top:6px;}
.statRow{display:flex; gap:22px; justify-content:center; margin-top:10px; font-size:13px; color:var(--himmea);}
.statRow b{color:var(--teksti); font-size:16px; display:block;}
button{
  font-family:inherit; font-size:17px; font-weight:700; border:none; border-radius:16px;
  padding:14px 30px; cursor:pointer; color:#fff;
}
.btnPlay{background:linear-gradient(160deg,var(--lakka2),var(--lakka)); color:#3A2105; font-size:20px; padding:16px 48px; box-shadow:0 6px 20px rgba(240,140,46,0.35);}
.btnGhost{background:rgba(255,255,255,0.08); color:var(--teksti); font-size:15px; padding:11px 22px;}

/* ---------- Pelinäkymä ---------- */
#gameScreen{justify-content:flex-start; gap:8px; padding-top:10px;}
.hud{display:flex; width:100%; max-width:420px; justify-content:space-between; align-items:baseline;}
.hud .score{font-size:26px; font-weight:800;}
.hud .target{font-size:13px; color:var(--himmea);}
.hud .lvl{font-size:14px; color:var(--lakka2); font-weight:700;}
.timerWrap{width:100%; max-width:420px; height:8px; background:rgba(255,255,255,0.1); border-radius:4px; overflow:hidden;}
.timerBar{height:100%; width:100%; background:var(--sammal); border-radius:4px; transition:width 0.5s linear;}
.timerBar.low{background:var(--vaara);}
.currentWord{
  height:38px; font-size:24px; font-weight:800; letter-spacing:2px; text-transform:uppercase;
  display:flex; align-items:center; justify-content:center; min-width:120px; border-radius:12px; padding:0 16px;
}
.currentWord.ok{color:var(--sammal);}
.currentWord.dup{color:var(--himmea);}
.gridWrap{position:relative; width:min(92vw,400px); aspect-ratio:1; touch-action:none;}
svg.trail{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2;}
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:100%; height:100%;}
.tile{
  background:linear-gradient(165deg,var(--koivu),var(--koivu2));
  border-radius:16px; display:flex; align-items:center; justify-content:center;
  font-size:34px; font-weight:800; color:#3B2E1E; text-transform:uppercase;
  box-shadow:0 3px 0 rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.6);
  position:relative; transition:transform 0.08s;
}
.tile .pts{position:absolute; bottom:5px; right:8px; font-size:11px; font-weight:700; color:#A08A66;}
.tile.sel{
  background:linear-gradient(165deg,var(--lakka2),var(--lakka));
  color:#3A2105; transform:scale(0.93);
  box-shadow:0 0 16px rgba(240,140,46,0.6);
}
.tile.flash{animation:flash 0.4s;}
@keyframes flash{0%{background:var(--sammal); color:#fff;} 100%{}}
.foundWrap{width:100%; max-width:420px; flex:1; min-height:60px; overflow-y:auto;}
.foundList{display:flex; flex-wrap:wrap; gap:6px; justify-content:center;}
.chip{background:rgba(255,255,255,0.08); border-radius:10px; padding:4px 10px; font-size:13px; font-weight:600;}
.chip b{color:var(--lakka2); font-weight:800;}

/* ---------- Tulosnäkymä ---------- */
#endScreen{justify-content:center; gap:12px; text-align:center;}
.resultBig{font-size:34px; font-weight:800;}
.resultBig.pass{color:var(--sammal);}
.resultBig.fail{color:var(--vaara);}
.resultScore{font-size:20px;}
.resultScore b{color:var(--lakka2); font-size:28px;}
.newTitle{background:rgba(240,140,46,0.15); border:1px solid var(--lakka); border-radius:16px; padding:12px 20px; font-size:16px;}
.newTitle b{display:block; font-size:22px; color:var(--lakka2);}
.achPop{background:rgba(127,176,105,0.15); border:1px solid var(--sammal); border-radius:14px; padding:9px 16px; font-size:14px;}
.missedWrap{max-width:420px; width:100%;}
.missedWrap h3{font-size:13px; color:var(--himmea); margin-bottom:6px; font-weight:600;}

/* ---------- Saavutukset ---------- */
#achScreen{gap:10px;}
#achScreen h2{font-size:24px; margin-bottom:4px;}
.achList{display:flex; flex-direction:column; gap:8px; width:100%; max-width:420px;}
.ach{display:flex; gap:12px; align-items:center; background:rgba(255,255,255,0.05); border-radius:14px; padding:11px 14px; opacity:0.45;}
.ach.done{opacity:1; background:rgba(127,176,105,0.12); border:1px solid rgba(127,176,105,0.35);}
.ach .icon{font-size:24px;}
.ach .name{font-weight:700; font-size:15px;}
.ach .desc{font-size:12px; color:var(--himmea);}
.titleList{display:flex; flex-direction:column; gap:5px; width:100%; max-width:420px; margin-top:10px;}
.titleRow{display:flex; justify-content:space-between; font-size:14px; padding:7px 12px; border-radius:10px; background:rgba(255,255,255,0.04); color:var(--himmea);}
.titleRow.earned{color:var(--teksti); background:rgba(240,140,46,0.1);}
.titleRow.earned .tn{color:var(--lakka2); font-weight:700;}
.loadMsg{color:var(--himmea); font-size:14px;}
</style>
</head>
<body>

<!-- ALOITUS -->
<div class="screen active" id="startScreen">
  <div class="logo">Sana<span class="a">ment</span></div>
  <div class="tagline">Pyyhkäise sanoja – vain suomeksi</div>
  <div class="levelCard">
    <div class="levelNum" id="lvlNum">Taso 1</div>
    <div class="titleName" id="titleName">Aapisen Avaaja</div>
    <div class="titleHint" id="titleHint"></div>
    <div class="statRow">
      <div><b id="stTotal">0</b>pistettä yht.</div>
      <div><b id="stWords">0</b>sanaa löydetty</div>
      <div><b id="stBest">–</b>paras sana</div>
    </div>
  </div>
  <button class="btnPlay" id="btnPlay">Pelaa</button>
  <button class="btnGhost" id="btnAch">Saavutukset & tittelit</button>
  <div class="loadMsg" id="loadMsg">Ladataan sanastoa…</div>
</div>

<!-- PELI -->
<div class="screen" id="gameScreen">
  <div class="hud">
    <div class="lvl" id="hudLvl">Taso 1</div>
    <div><span class="score" id="hudScore">0</span> <span class="target" id="hudTarget">/ 60</span></div>
    <div class="lvl" id="hudTime">2:00</div>
  </div>
  <div class="timerWrap"><div class="timerBar" id="timerBar"></div></div>
  <div class="currentWord" id="currentWord">&nbsp;</div>
  <div class="gridWrap" id="gridWrap">
    <svg class="trail" id="trail"></svg>
    <div class="grid" id="grid"></div>
  </div>
  <div class="foundWrap"><div class="foundList" id="foundList"></div></div>
</div>

<!-- TULOS -->
<div class="screen" id="endScreen">
  <div class="resultBig" id="resultBig">Taso läpäisty!</div>
  <div class="resultScore">Pisteet: <b id="endScore">0</b> <span id="endTarget"></span></div>
  <div id="endExtras"></div>
  <div class="missedWrap">
    <h3>Parhaat löytämättä jääneet:</h3>
    <div class="foundList" id="missedList"></div>
  </div>
  <button class="btnPlay" id="btnNext">Jatka</button>
  <button class="btnGhost" id="btnHome">Alkuun</button>
</div>

<!-- SAAVUTUKSET -->
<div class="screen" id="achScreen">
  <h2>🏆 Saavutukset</h2>
  <div class="achList" id="achList"></div>
  <h2 style="margin-top:14px">🎖️ Tittelit</h2>
  <div class="titleList" id="titleList"></div>
  <button class="btnGhost" id="btnBack" style="margin-top:14px">Takaisin</button>
</div>

nölistä\nöljy\nöljyalue\nöljyhappo\nöljyhiekka\nöljyhoito\nöljyinen\nöljyjohto\nöljykakku\nöljykalvo\nöljykangas\nöljykannu\nöljykasvi\nöljykenttä\nöljylamppu\nöljylautta\nöljyliuske\nöljylähde\nöljyläikkä\nöljyläiskä\nöljylöytö\nöljymaa\nöljymaali\nöljymäinen\nöljynpaine\nöljynviejä\nöljypalmu\nöljypisara\nöljypohja\nöljypoltin\nöljypumppu\nöljypuomi\nöljypuu\nöljysampoo\nöljysatama\nöljysora\nöljysuoni\nöljysäiliö\nöljytahra\nöljytakki\nöljytankki\nöljytila\nöljyttyä\nöljytuho\nöljytuikku\nöljytuote\nöljytä\nöljyvalo\nöljyvarat\nöljyväri\nöljyyntyä\nörinä\nöristä\nörähdys\nörähtää\nötökkä\nöykkäri\nöykkäröidä\nöylätti";
let WORDS = null, PREFIX = null;
function buildDicts(){
  const list = RAW_WORDS.split("\n");
  WORDS = new Set(list);
  PREFIX = new Set();
  for(const w of list){
    for(let i=1; i<w.length; i++) PREFIX.add(w.slice(0,i));
  }
  document.getElementById('loadMsg').textContent = list.length.toLocaleString('fi') + " sanaa ladattu ✓";
}
setTimeout(buildDicts, 50);

/* ================= PISTEET & KIRJAIMET ================= */
const LETTER_PTS = {a:1,i:1,t:1, u:2,s:2,k:2,e:2,l:2,o:2,n:2, r:3,'ä':3,p:3,m:3,h:3,v:3,y:3, j:5,'ö':5,d:5, g:8,b:8,f:8};
// painotettu jakelu (frekvenssi ‰, hieman tasoitettu)
const LETTER_BAG = [];
const FREQ = {a:124,i:108,t:87,u:68,s:68,k:66,e:60,l:59,o:54,n:50,r:41,'ä':40,p:33,m:29,h:26,v:25,y:24,j:13,'ö':9,d:8,g:2,b:2,f:2};
for(const [ch,w] of Object.entries(FREQ)) for(let i=0;i<w;i++) LETTER_BAG.push(ch);
const VOWELS = new Set(['a','e','i','o','u','y','ä','ö']);

function lenMult(n){ return n<=4?1 : n===5?1.5 : n===6?2 : n===7?2.5 : 3; }
function wordScore(w){
  let s=0; for(const ch of w) s += LETTER_PTS[ch]||1;
  return Math.round(s * lenMult(w.length));
}

/* ================= TITTELIT ================= */
const TITLES = [
  [1,  "Aapisen Avaaja"],
  [10, "Tavutaituri"],
  [20, "Sanaseppä"],
  [30, "Riimiritari"],
  [40, "Kirjainkenraali"],
  [50, "Lauselordi"],
  [60, "Sanastosamurai"],
  [70, "Kielikeisari"],
  [80, "Aakkosarkkitehti"],
  [90, "Murremaharadža"],
  [100,"Sanamentin Suurmestari"]
];
function titleFor(lvl){
  let t = TITLES[0][1];
  for(const [l,n] of TITLES) if(lvl>=l) t=n;
  return t;
}
function nextTitle(lvl){
  for(const [l,n] of TITLES) if(l>lvl) return [l,n];
  return null;
}

/* ================= SAAVUTUKSET ================= */
const ACHS = [
  {id:'first',   icon:'🌱', name:'Ensisana',        desc:'Löydä ensimmäinen sanasi'},
  {id:'ten',     icon:'🔟', name:'Kymppikerho',     desc:'10 sanaa yhdessä pelissä'},
  {id:'flood',   icon:'🌊', name:'Sanatulva',       desc:'25 sanaa yhdessä pelissä'},
  {id:'long7',   icon:'📏', name:'Pitkä Jussi',     desc:'Löydä 7+ kirjaimen sana'},
  {id:'long9',   icon:'🦒', name:'Jättiläinen',     desc:'Löydä 9+ kirjaimen sana'},
  {id:'umlaut',  icon:'🇫🇮', name:'Ääkkösvelho',     desc:'Sana jossa sekä ä että ö'},
  {id:'big100',  icon:'💥', name:'Satanen',         desc:'100+ pistettä yhdessä pelissä'},
  {id:'tot1000', icon:'🏔️', name:'Tuhatmestari',    desc:'1000 pistettä yhteensä'},
  {id:'lvl10',   icon:'🎖️', name:'Ensimmäinen titteli', desc:'Saavuta taso 10'},
  {id:'lvl50',   icon:'👑', name:'Puolimatka',      desc:'Saavuta taso 50'}
];

/* ================= TALLENNUS ================= */
let S = {level:1, total:0, wordsFound:0, bestWord:'', bestWordPts:0, achs:{}};
function load(){
  try{ const j = localStorage.getItem('sanament'); if(j) S = Object.assign(S, JSON.parse(j)); }catch(e){}
}
function save(){
  try{ localStorage.setItem('sanament', JSON.stringify(S)); }catch(e){}
}
load();

/* ================= RUUDUKKO ================= */
let grid=[], solutions=new Map(), maxPts=0;

function randomGrid(){
  while(true){
    const g=[]; const counts={}; let v=0;
    for(let i=0;i<16;i++){
      let ch;
      do{ ch = LETTER_BAG[Math.floor(Math.random()*LETTER_BAG.length)]; }
      while((counts[ch]||0)>=2);
      counts[ch]=(counts[ch]||0)+1; if(VOWELS.has(ch)) v++;
      g.push(ch);
    }
    if(v>=5 && v<=8) return g;
  }
}
const NEIGH = [];
for(let i=0;i<16;i++){
  const r=Math.floor(i/4), c=i%4, list=[];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(!dr&&!dc) continue;
    const nr=r+dr, nc=c+dc;
    if(nr>=0&&nr<4&&nc>=0&&nc<4) list.push(nr*4+nc);
  }
  NEIGH.push(list);
}
function solveGrid(g){
  const found = new Map();
  const visited = new Array(16).fill(false);
  function dfs(idx, word){
    word += g[idx];
    if(word.length>10) return;
    if(word.length>=2 && !WORDS.has(word) && !PREFIX.has(word)) return;
    visited[idx]=true;
    if(word.length>=3 && WORDS.has(word) && !found.has(word)) found.set(word, wordScore(word));
    for(const n of NEIGH[idx]) if(!visited[n]) dfs(n, word);
    visited[idx]=false;
  }
  for(let i=0;i<16;i++) dfs(i,"");
  return found;
}
function makeGrid(){
  let best=null, bestScore=-1;
  for(let tries=0; tries<25; tries++){
    const g = randomGrid();
    const sol = solveGrid(g);
    let pts=0; for(const p of sol.values()) pts+=p;
    if(sol.size>=30 && pts>bestScore){ best=[g,sol,pts]; bestScore=pts; }
    if(sol.size>=60) break;
  }
  if(!best){ const g=randomGrid(); const sol=solveGrid(g); let pts=0; for(const p of sol.values()) pts+=p; best=[g,sol,pts]; }
  [grid, solutions, maxPts] = best;
}
function targetFor(lvl){
  const frac = Math.min(0.08 + lvl*0.004, 0.40);
  return Math.max(40, Math.round(maxPts*frac/5)*5);
}

/* ================= PELITILA ================= */
let score=0, found=new Map(), timeLeft=120, timerInt=null, target=60, playing=false;
let path=[], pathSet=new Set();
let roundNewAchs=[];

const $ = id=>document.getElementById(id);
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); }

function refreshStart(){
  $('lvlNum').textContent = 'Taso ' + S.level;
  $('titleName').textContent = titleFor(S.level);
  const nt = nextTitle(S.level);
  $('titleHint').textContent = nt ? `Seuraava titteli tasolla ${nt[0]}: ${nt[1]}` : 'Korkein titteli saavutettu! 🏆';
  $('stTotal').textContent = S.total.toLocaleString('fi');
  $('stWords').textContent = S.wordsFound.toLocaleString('fi');
  $('stBest').textContent = S.bestWord ? S.bestWord.toUpperCase() : '–';
}
refreshStart();

function startGame(){
  if(!WORDS){ alert('Sanasto latautuu vielä, hetki…'); return; }
  makeGrid();
  score=0; found=new Map(); timeLeft=120; playing=true; roundNewAchs=[];
  target = targetFor(S.level);
  $('hudLvl').textContent = 'Taso '+S.level;
  $('hudScore').textContent='0';
  $('hudTarget').textContent='/ '+target;
  $('foundList').innerHTML='';
  $('currentWord').textContent='\u00A0';
  renderGrid();
  show('gameScreen');
  clearInterval(timerInt);
  updateTimer();
  timerInt = setInterval(()=>{ timeLeft--; updateTimer(); if(timeLeft<=0) endGame(); }, 1000);
}
function updateTimer(){
  const m=Math.floor(timeLeft/60), s=timeLeft%60;
  $('hudTime').textContent = m+':'+String(s).padStart(2,'0');
  const bar=$('timerBar');
  bar.style.width = (timeLeft/120*100)+'%';
  bar.classList.toggle('low', timeLeft<=20);
}
function renderGrid(){
  const el=$('grid'); el.innerHTML='';
  grid.forEach((ch,i)=>{
    const d=document.createElement('div');
    d.className='tile'; d.dataset.idx=i;
    d.innerHTML = ch.toUpperCase()+'<span class="pts">'+(LETTER_PTS[ch]||1)+'</span>';
    el.appendChild(d);
  });
}

/* ---- kosketus ---- */
const wrap = $('gridWrap');
function tileAt(x,y){
  const r = wrap.getBoundingClientRect();
  const cx=(x-r.left)/r.width, cy=(y-r.top)/r.height;
  if(cx<0||cx>=1||cy<0||cy>=1) return -1;
  const col=Math.floor(cx*4), row=Math.floor(cy*4);
  // vaadi osuma laatan keskialueelle (75 %) viistovetojen helpottamiseksi
  const lx=cx*4-col, ly=cy*4-row;
  if(lx<0.125||lx>0.875||ly<0.125||ly>0.875) return -1;
  return row*4+col;
}
function tileCenter(i){
  const r=wrap.getBoundingClientRect();
  const row=Math.floor(i/4), col=i%4;
  return [ (col+0.5)/4*r.width, (row+0.5)/4*r.height ];
}
function drawTrail(){
  const svg=$('trail');
  if(path.length<1){ svg.innerHTML=''; return; }
  let d='';
  path.forEach((i,n)=>{ const [x,y]=tileCenter(i); d += (n?'L':'M')+x+' '+y+' '; });
  svg.innerHTML = `<path d="${d}" fill="none" stroke="rgba(240,140,46,0.55)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function setSel(){
  document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('sel', pathSet.has(+t.dataset.idx)));
  drawTrail();
  const w = path.map(i=>grid[i]).join('');
  const cw=$('currentWord');
  cw.textContent = w || '\u00A0';
  cw.className='currentWord';
  if(w.length>=3 && WORDS.has(w)) cw.classList.add(found.has(w)?'dup':'ok');
}
function onDown(e){
  if(!playing) return;
  e.preventDefault();
  const i=tileAt(e.clientX,e.clientY);
  if(i>=0){ path=[i]; pathSet=new Set([i]); setSel(); }
}
function onMove(e){
  if(!playing || !path.length) return;
  e.preventDefault();
  const i=tileAt(e.clientX,e.clientY);
  if(i<0) return;
  const last=path[path.length-1];
  if(i===last) return;
  // peruutus: takaisin edelliseen
  if(path.length>=2 && i===path[path.length-2]){
    pathSet.delete(last); path.pop(); setSel(); return;
  }
  if(!pathSet.has(i) && NEIGH[last].includes(i)){
    path.push(i); pathSet.add(i); setSel();
  }
}
function onUp(e){
  if(!playing || !path.length) return;
  submitWord(path.map(i=>grid[i]).join(''));
  path=[]; pathSet=new Set(); setSel();
}
wrap.addEventListener('pointerdown', onDown);
wrap.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);

function submitWord(w){
  if(w.length<3 || !WORDS.has(w) || found.has(w)) return;
  const pts = wordScore(w);
  found.set(w,pts); score+=pts;
  $('hudScore').textContent = score;
  const chip=document.createElement('div');
  chip.className='chip'; chip.innerHTML = w.toUpperCase()+' <b>+'+pts+'</b>';
  $('foundList').prepend(chip);
  // välähdys laatoissa
  path.forEach(i=>{
    const t=document.querySelector(`.tile[data-idx="${i}"]`);
    if(t){ t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
  });
  // saavutustarkistukset
  if(!S.achs.first) unlock('first');
  if(found.size>=10 && !S.achs.ten) unlock('ten');
  if(found.size>=25 && !S.achs.flood) unlock('flood');
  if(w.length>=7 && !S.achs.long7) unlock('long7');
  if(w.length>=9 && !S.achs.long9) unlock('long9');
  if(w.includes('ä') && w.includes('ö') && !S.achs.umlaut) unlock('umlaut');
  if(score>=100 && !S.achs.big100) unlock('big100');
  if(pts > S.bestWordPts){ S.bestWord=w; S.bestWordPts=pts; }
}
function unlock(id){ S.achs[id]=true; roundNewAchs.push(id); save(); }

function endGame(){
  playing=false; clearInterval(timerInt);
  const pass = score>=target;
  S.total += score;
  S.wordsFound += found.size;
  if(S.total>=1000 && !S.achs.tot1000) unlock('tot1000');
  const oldTitle = titleFor(S.level);
  if(pass) S.level++;
  if(S.level>=10 && !S.achs.lvl10) unlock('lvl10');
  if(S.level>=50 && !S.achs.lvl50) unlock('lvl50');
  const newT = titleFor(S.level);
  save();

  $('resultBig').textContent = pass ? 'Taso läpäisty! 🎉' : 'Ei ihan riittänyt 😅';
  $('resultBig').className = 'resultBig '+(pass?'pass':'fail');
  $('endScore').textContent = score;
  $('endTarget').textContent = '/ tavoite '+target+' · sanoja '+found.size;
  let extras='';
  if(pass && newT!==oldTitle){
    extras += `<div class="newTitle">Uusi titteli!<b>${newT}</b></div>`;
  }
  for(const id of roundNewAchs){
    const a=ACHS.find(x=>x.id===id);
    extras += `<div class="achPop">${a.icon} Saavutus: <b>${a.name}</b></div>`;
  }
  $('endExtras').innerHTML = extras;

  // löytämättä jääneet parhaat
  const missed=[...solutions.entries()].filter(([w])=>!found.has(w)).sort((a,b)=>b[1]-a[1]).slice(0,8);
  $('missedList').innerHTML = missed.map(([w,p])=>`<div class="chip">${w.toUpperCase()} <b>${p}</b></div>`).join('');
  $('btnNext').textContent = pass ? 'Seuraava taso' : 'Yritä uudelleen';
  show('endScreen');
}

/* ---- saavutusnäkymä ---- */
function showAch(){
  $('achList').innerHTML = ACHS.map(a=>`
    <div class="ach ${S.achs[a.id]?'done':''}">
      <div class="icon">${a.icon}</div>
      <div><div class="name">${a.name}</div><div class="desc">${a.desc}</div></div>
    </div>`).join('');
  $('titleList').innerHTML = TITLES.map(([l,n])=>`
    <div class="titleRow ${S.level>=l?'earned':''}"><span class="tn">${n}</span><span>taso ${l}</span></div>`).join('');
  show('achScreen');
}

$('btnPlay').onclick = startGame;
$('btnNext').onclick = startGame;
$('btnHome').onclick = ()=>{ refreshStart(); show('startScreen'); };
$('btnBack').onclick = ()=>{ refreshStart(); show('startScreen'); };
$('btnAch').onclick = showAch;
</script>
